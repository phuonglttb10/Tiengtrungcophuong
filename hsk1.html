<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiếng Trung Cô Phương · Giáo trình chuẩn HSK1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --accent:#c23320;
  --accent-dark:#8f2415;
  --accent-soft:#f0d9ce;
  --bg:#f6efe0;
  --bg-alt:#eee2c8;
  --card:#fffdf7;
  --ink:#2b241d;
  --ink-soft:#6d6152;
  --line:#e3d5b4;
  --success:#4f7a5b;
  --success-bg:#e2ede2;
  --error:#a8402f;
  --error-bg:#f6e2da;
  --radius:16px;
  --sidebar-w:280px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Be Vietnam Pro',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
}
.hanzi,.zh{font-family:'Noto Serif SC',serif;}
.mono{font-family:'Space Mono',monospace;}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--accent-dark);
  color:#fdf3ea;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
#brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.15);
  position:relative;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 34px);
}
#brand .logo{
  display:flex;align-items:center;gap:10px;
}
#brand .logo .mark{
  width:40px;height:40px;border-radius:10px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif;font-weight:700;font-size:20px;color:#fff;
  flex-shrink:0;
}
#brand .logo .name{font-weight:700;font-size:16px;line-height:1.25;}
#brand .logo .name small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:.04em;}
.social-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.social-row a{
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  color:#fdf3ea;text-decoration:none;font-size:13px;
  transition:background .15s;
}
.social-row a:hover{background:var(--accent);}
.zalo-note{font-size:11px;opacity:.7;margin-top:8px;}

#lesson-list{list-style:none;margin:0;padding:10px 10px 20px;flex:1;}
#lesson-list li{margin-bottom:4px;}
.lesson-btn{
  width:100%;text-align:left;background:none;border:none;color:inherit;
  padding:10px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;
  display:flex;align-items:center;gap:10px;
  font-family:'Be Vietnam Pro',sans-serif;
}
.lesson-btn .num{
  width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;
}
.lesson-btn .lbl{flex:1;line-height:1.25;}
.lesson-btn .lbl .zh{display:block;font-size:14px;}
.lesson-btn .lbl .vi{display:block;font-size:10.5px;opacity:.65;}
.lesson-btn.active{background:var(--accent);}
.lesson-btn.active .num{background:rgba(255,255,255,.25);}
.lesson-btn.disabled{opacity:.4;cursor:default;}
.lesson-btn:not(.disabled):hover{background:rgba(255,255,255,.1);}
.lesson-btn.active:not(.disabled):hover{background:var(--accent);}
.soon-tag{font-size:9px;background:rgba(255,255,255,.15);padding:1px 6px;border-radius:20px;margin-left:4px;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#tabbar{
  display:flex;gap:4px;overflow-x:auto;
  padding:14px 24px 0;
  background:var(--bg-alt);
  border-bottom:2px solid var(--line);
  position:sticky;top:0;z-index:5;
}
.tab-btn{
  background:none;border:none;cursor:pointer;
  padding:10px 14px;font-size:13px;font-weight:600;
  color:var(--ink-soft);border-radius:10px 10px 0 0;white-space:nowrap;
  font-family:'Be Vietnam Pro',sans-serif;
  display:flex;align-items:center;gap:6px;
}
.tab-btn.active{background:var(--card);color:var(--accent);}
.tab-btn:hover:not(.active){color:var(--ink);}
#content{padding:28px 32px 60px;max-width:1080px;}

/* ---------- generic ---------- */
h1,h2,h3{font-family:'Noto Serif SC',serif;color:var(--ink);}
.section-title{font-size:22px;font-weight:700;margin:0 0 4px;}
.section-sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-dark);
  font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.02em;}
.btn{
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:'Be Vietnam Pro',sans-serif;
}
.btn:hover{background:var(--accent-dark);}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink);}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:8px;}
.speak-btn{
  border:none;background:var(--bg-alt);color:var(--accent-dark);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.speak-btn:hover{background:var(--accent);color:#fff;}
.placeholder{
  border:2px dashed var(--line);border-radius:var(--radius);
  padding:50px 20px;text-align:center;color:var(--ink-soft);
}
.placeholder .big{font-size:38px;display:block;margin-bottom:10px;}

/* overview */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0;}
.goal-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
.goal-card .ic{font-size:20px;}
.goal-card h4{margin:8px 0 4px;font-size:13.5px;font-family:'Be Vietnam Pro';color:var(--accent-dark);}
.goal-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.hero-title{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:30px 26px;position:relative;overflow:hidden;
}
.hero-title:before{
  content:"";position:absolute;inset:0;
  background-image:repeating-linear-gradient(0deg, rgba(194,51,32,.05) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, rgba(194,51,32,.05) 0 1px, transparent 1px 40px);
  pointer-events:none;
}
.hero-title .num-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:52px;height:52px;background:var(--accent);color:#fff;border-radius:14px;
  font-family:'Noto Serif SC';font-weight:900;font-size:26px;margin-bottom:14px;
}
.hero-title .hz{font-size:40px;font-weight:700;margin:2px 0;}
.hero-title .py{color:var(--accent-dark);font-weight:600;font-size:16px;}
.hero-title .vi{font-size:15px;color:var(--ink-soft);margin-top:2px;}
.stat-row{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap;}
.stat-row .s{font-size:12.5px;color:var(--ink-soft);}
.stat-row .s b{display:block;font-size:20px;color:var(--ink);font-family:'Noto Serif SC';}

/* vocab table */
table.vocab{width:100%;border-collapse:collapse;font-size:13.5px;}
table.vocab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);border-bottom:2px solid var(--line);padding:8px 10px;}
table.vocab td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.vocab tr:hover td{background:var(--bg-alt);}
.vocab .hz-cell{font-size:22px;font-weight:600;}
.vocab .py-cell{color:var(--accent-dark);font-weight:600;}
.tag-loai{font-size:10.5px;background:var(--bg-alt);padding:2px 7px;border-radius:6px;color:var(--ink-soft);}

/* vocab grid cards (ôn từ vựng lưới 3 cột) */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:900px){.vgrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.vgrid{grid-template-columns:1fr;}}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;}
.vcard .ic{font-size:18px;margin-bottom:4px;}
.vcard .hz{font-size:30px;font-weight:700;}
.vcard .py{color:var(--accent-dark);font-weight:600;font-size:13.5px;margin-top:2px;}
.vcard .vi{font-size:13px;margin:4px 0 6px;}
.vcard .ex{font-size:11.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:6px;}
.vcard .speak-btn{position:absolute;top:12px;right:12px;}

/* flashcards */
#flash-controls{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.flashcard{
  perspective:1000px;height:150px;cursor:pointer;
}
.flashcard .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.flashcard.flipped .inner{transform:rotateY(180deg);}
.flashcard .face{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--line);padding:10px;text-align:center;
}
.flashcard .front{background:var(--card);}
.flashcard .front .hz{font-size:36px;font-weight:700;}
.flashcard .back{background:var(--accent);color:#fff;transform:rotateY(180deg);}
.flashcard .back .py{font-weight:700;font-size:16px;}
.flashcard .back .vi{font-size:12.5px;margin-top:4px;opacity:.95;}
#flash-single{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:26px;}
#flash-single .flashcard{width:260px;height:190px;}
#flash-single .front .hz{font-size:56px;}
.flash-nav{display:flex;gap:12px;align-items:center;}
.flash-counter{font-size:12.5px;color:var(--ink-soft);}

/* exercise blocks */
.ex-block{margin-bottom:30px;}
.ex-block h3{font-size:15.5px;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.ex-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.q .qtext{font-size:14px;margin-bottom:10px;font-weight:500;}
.q .qtext .zh{font-size:17px;}
.opt-row{display:flex;flex-direction:column;gap:7px;}
.opt{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);
  border-radius:9px;cursor:pointer;font-size:13.5px;background:#fff;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:var(--success-bg);border-color:var(--success);}
.opt.wrong{background:var(--error-bg);border-color:var(--error);}
.q input[type=text]{
  border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;
  width:100%;max-width:320px;font-family:'Be Vietnam Pro';
}
.q .fb{font-size:12.5px;margin-top:8px;font-weight:600;}
.fb.ok{color:var(--success);}
.fb.no{color:var(--error);}
.token-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.token{
  background:var(--bg-alt);border:1.5px solid var(--line);border-radius:8px;
  padding:6px 12px;font-size:16px;cursor:pointer;font-family:'Noto Serif SC';
}
.token.used{opacity:.3;pointer-events:none;}
.token-answer{
  min-height:44px;border:2px dashed var(--line);border-radius:9px;padding:8px 10px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;
}
.token-answer .token{background:var(--accent-soft);border-color:var(--accent);cursor:pointer;}
select.match-select{border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-family:'Be Vietnam Pro';}

/* grammar */
.gpoint{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
.gpoint .gtitle{font-size:16px;font-weight:700;margin:0 0 4px;color:var(--accent-dark);}
.gpoint .gstruct{
  background:var(--bg-alt);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;
  display:inline-block;margin:8px 0 12px;
}
.gpoint .gexplain{font-size:13.5px;line-height:1.6;margin-bottom:12px;}
.gex{border-left:3px solid var(--accent-soft);padding:6px 0 6px 12px;margin-bottom:8px;}
.gex .zh{font-size:15px;}
.gex .py{color:var(--accent-dark);font-size:12.5px;}
.gex .vi{font-size:12.5px;color:var(--ink-soft);}
.gnote{background:var(--error-bg);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--accent-dark);margin-top:10px;}
.gnote b{color:var(--error);}

/* dialogue */
.dlg-scene{margin-bottom:32px;}
.dlg-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.dlg-head h3{margin:0;font-size:16px;}
.toggle-row{display:flex;gap:8px;}
.toggle-btn{
  border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;
  font-size:11.5px;cursor:pointer;color:var(--ink-soft);font-family:'Be Vietnam Pro';
}
.toggle-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.dlg-line{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start;}
.avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;margin-top:2px;
}
.dlg-bubble{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex:1;}
.dlg-bubble .zh{font-size:18px;}
.dlg-bubble .py{color:var(--accent-dark);font-size:12.5px;margin-top:2px;}
.dlg-bubble .vi{font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-style:italic;}
.hidden{display:none !important;}

/* hanzi */
.hz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.hz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.hz-card .top{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
.tzg{
  width:64px;height:64px;flex-shrink:0;border:1.5px solid var(--ink-soft);position:relative;background:#fff;
}
.tzg:before,.tzg:after{content:"";position:absolute;background:var(--line);}
.tzg:before{left:0;right:0;top:50%;height:1px;}
.tzg:after{top:0;bottom:0;left:50%;width:1px;}
.tzg .ch{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC';font-size:44px;color:rgba(43,36,29,.85);
}
.hz-card .meta{flex:1;}
.hz-card .meta .py{color:var(--accent-dark);font-weight:700;font-size:15px;}
.hz-card .meta .vi{font-size:12.5px;}
.hz-card .info-row{display:flex;gap:10px;font-size:11px;color:var(--ink-soft);margin-top:2px;flex-wrap:wrap;}
.hz-card .info-row span b{color:var(--ink);}
.hz-card .radical-box{background:var(--bg-alt);border-radius:9px;padding:8px 10px;font-size:12px;margin:8px 0;}
.hz-card .tip{font-size:12px;color:var(--ink-soft);font-style:italic;}
.practice-row{display:flex;gap:6px;margin-top:10px;}
.tzg.mini{width:38px;height:38px;}
.tzg.mini .ch{font-size:24px;opacity:.18;}
.tzg.blank .ch{content:"";}
.tzg.blank{background:#fff;}

.footer-note{margin-top:40px;font-size:11.5px;color:var(--ink-soft);text-align:center;}

/* special views: bài tập / cây tiến bộ */
.special-nav{padding:10px 10px 4px;border-top:1px solid rgba(255,255,255,.15);margin-top:8px;}
.special-btn{
  width:100%;text-align:left;background:none;border:none;color:inherit;padding:10px 12px;border-radius:10px;
  cursor:pointer;font-size:13px;display:flex;align-items:center;gap:9px;font-family:'Be Vietnam Pro';margin-bottom:2px;
}
.special-btn.active{background:var(--accent);}
.special-btn:not(.active):hover{background:rgba(255,255,255,.1);}
.tree-wrap2{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.tree-visual2{width:110px;height:110px;border-radius:50%;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;font-size:52px;flex-shrink:0;transition:transform .3s;}
.tree-progress-track2{width:220px;background:var(--bg-alt);border-radius:20px;height:9px;overflow:hidden;}
.tree-progress-fill2{background:var(--accent);height:100%;border-radius:20px;transition:width .5s;}
.milestone2{background:var(--bg-alt);border-radius:11px;padding:10px 14px;font-size:12.5px;margin-bottom:8px;}
.assign-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.assign-card h4{margin:0 0 4px;font-size:14.5px;}
.assign-card .due{font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;}
.assign-card textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;min-height:70px;font-family:'Be Vietnam Pro';margin-bottom:8px;}

/* login gate */
#login-gate{
  position:fixed;inset:0;background:var(--accent-dark);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#login-gate .box{
  background:var(--card);border-radius:var(--radius);padding:32px 28px;max-width:360px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
#login-gate .mark{
  width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Noto Serif SC';font-weight:700;font-size:22px;margin-bottom:12px;
}
#login-gate h2{margin:0 0 4px;font-size:19px;}
#login-gate p{margin:0 0 18px;font-size:12.5px;color:var(--ink-soft);}
#login-gate label{display:block;font-size:12px;font-weight:600;margin:12px 0 5px;color:var(--ink-soft);}
#login-gate input{
  width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;
  font-family:'Be Vietnam Pro';
}
#login-gate .btn{width:100%;margin-top:18px;padding:11px;}
#login-gate .err{color:var(--error);font-size:12px;margin-top:8px;display:none;}
#student-badge{
  position:sticky;top:0;z-index:6;background:var(--card);border-bottom:1px solid var(--line);
  padding:6px 24px;font-size:11.5px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;
}
#student-badge button{background:none;border:none;color:var(--accent);font-size:11.5px;cursor:pointer;font-family:'Be Vietnam Pro';text-decoration:underline;}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:5px;}

/* mobile */
#sidebar-toggle{display:none;}
@media(max-width:840px){
  #sidebar{position:fixed;left:-100%;z-index:50;transition:left .25s;box-shadow:0 0 30px rgba(0,0,0,.3);}
  #sidebar.open{left:0;}
  #sidebar-toggle{
    display:flex;position:sticky;top:0;z-index:20;background:var(--accent-dark);color:#fff;
    border:none;padding:12px 16px;font-size:13px;align-items:center;gap:8px;cursor:pointer;width:100%;
  }
  #content{padding:20px 16px 50px;}
  .vgrid,.hz-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="login-gate">
  <div class="box">
    <div class="mark">中</div>
    <h2>Tiếng Trung Cô Phương</h2>
    <p>Vui lòng nhập thông tin để bắt đầu học. Kết quả học tập sẽ được đồng bộ về hệ thống quản lý.</p>
    <label>Họ và tên</label>

   Hướng dẫn deploy: xem hướng dẫn đi kèm khi nhận file này.
   ============================================================ */
const CONFIG = {
  SHEET_WEBAPP_URL: 'https://script.google.com/macros/s/AKfycbx5uFtJvZxGeDpd5x6u-AKowmimZvmaeJcw_2CYEVtj_2-eb2QSCUK-6eXuzEfE7WCf1g/exec',
};

/* ============================================================
   STATE & UTILITIES
   ============================================================ */
let state = {lessonId:6, tab:'overview', specialView:null};
let student = null; // {name, class}
let currentAttempts = []; // ghi nhận đúng/sai của tab đang mở, dùng để nộp kết quả

function logToSheet(payload){
  if(!CONFIG.SHEET_WEBAPP_URL || CONFIG.SHEET_WEBAPP_URL.indexOf('DÁN_ID_WEB_APP')>-1){
    console.warn('Chưa cấu hình SHEET_WEBAPP_URL — bỏ qua đồng bộ Google Sheet.', payload);
    return;
  }
  fetch(CONFIG.SHEET_WEBAPP_URL, {
    method:'POST',
    mode:'no-cors', // Apps Script không trả CORS header nên dùng no-cors (không đọc được response, nhưng ghi vẫn thành công)
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).catch(err=>console.warn('Không gửi được log lên Google Sheet:', err));
}

// Kiểm tra tên + lớp có nằm trong danh sách học viên hợp lệ (tab DanhSachHV) không.
// Dùng GET (không phải POST) vì đây là request "đơn giản", trình duyệt đọc được response từ Apps Script.
async function checkStudentValid(name, klass){
  if(!CONFIG.SHEET_WEBAPP_URL || CONFIG.SHEET_WEBAPP_URL.indexOf('DÁN_ID_WEB_APP')>-1){
    return {ok:false, reason:'config'}; // chưa cấu hình URL
  }
  try{
    const url = CONFIG.SHEET_WEBAPP_URL + '?action=checkLogin&name=' + encodeURIComponent(name) + '&class=' + encodeURIComponent(klass);
    const res = await fetch(url, {method:'GET'});
    const data = await res.json();
    return {ok: !!data.valid, reason: data.valid ? 'valid' : 'not_found'};
  }catch(err){
    console.warn('Không kiểm tra được danh sách học viên:', err);
    return {ok:false, reason:'network'};
  }
}

async function doLogin(){
  const name = document.getElementById('lg-name').value.trim();
  const klass = document.getElementById('lg-class').value.trim();
  const errBox = document.getElementById('lg-err');
  const btn = document.getElementById('lg-btn');
  errBox.style.display='none';
  if(!name || !klass){ errBox.textContent='Vui lòng nhập đầy đủ họ tên và lớp/mã học viên.'; errBox.style.display='block'; return; }

  btn.disabled = true; btn.textContent='Đang kiểm tra...';
  const check = await checkStudentValid(name, klass);
  btn.disabled = false; btn.textContent='Bắt đầu học';

  if(!check.ok){
    if(check.reason==='config'){
      errBox.textContent='Hệ thống chưa được cấu hình danh sách học viên. Vui lòng liên hệ giáo viên.';
    }else if(check.reason==='network'){
      errBox.textContent='Không kết nối được hệ thống kiểm tra. Vui lòng thử lại hoặc liên hệ giáo viên.';
    }else{
      errBox.textContent='Tên hoặc mã lớp không đúng / chưa được đăng ký. Vui lòng kiểm tra lại hoặc liên hệ giáo viên.';
    }
    errBox.style.display='block';
    return;
  }

  student = {name, class:klass};
  localStorage.setItem('ttcp_student', JSON.stringify(student));
  document.getElementById('login-gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('badge-name').textContent = name;
  document.getElementById('badge-class').textContent = klass;
  logToSheet({action:'login', name:student.name, class:student.class, lesson:LESSONS[state.lessonId].unit, time:new Date().toISOString()});
  renderAll();
}
function doLogout(){
  localStorage.removeItem('ttcp_student');
  location.reload();
}
function checkLoginOnLoad(){
  const saved = localStorage.getItem('ttcp_student');
  if(saved){
    student = JSON.parse(saved);
    document.getElementById('login-gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('badge-name').textContent = student.name;
    document.getElementById('badge-class').textContent = student.class;
    logToSheet({action:'login', name:student.name, class:student.class, lesson:LESSONS[state.lessonId].unit, time:new Date().toISOString()});
    return true;
  }
  return false;
}

// gọi mỗi khi có 1 câu được chấm (đúng/sai) trong tab hiện tại
function recordAttempt(isCorrect){
  currentAttempts.push(isCorrect);
  updateScoreBadge();
}
function updateScoreBadge(){
  const b = document.getElementById('score-badge');
  if(!b) return;
  const correct = currentAttempts.filter(x=>x).length;
  b.textContent = `Điểm tạm tính: ${correct}/${currentAttempts.length}`;
}
function submitResults(tabLabel){
  const correct = currentAttempts.filter(x=>x).length;
  const total = currentAttempts.length;
  if(total===0){ alert('Bạn chưa làm câu nào trong phần này.'); return; }
  if(!student){ alert('Vui lòng đăng nhập trước khi nộp kết quả.'); return; }
  logToSheet({
    action:'result', name:student.name, class:student.class,
    lesson:LESSONS[state.lessonId].unit, tab:tabLabel,
    correct, total, percent:Math.round(correct/total*100),
    time:new Date().toISOString()
  });
  const box = document.getElementById('submit-result-box');
  if(box) box.innerHTML = `<div class="fb ok">✓ Đã nộp kết quả: ${correct}/${total} câu đúng (${Math.round(correct/total*100)}%)</div>`;
}
function submitBar(tabLabel){
  return `<div class="card" style="margin-top:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <span id="score-badge" style="font-size:13px;font-weight:600;">Điểm tạm tính: 0/0</span>
    <button class="btn" onclick="submitResults('${tabLabel}')">📤 Nộp kết quả về hệ thống</button>
  </div><div id="submit-result-box"></div>`;
}

function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.9;
    window.speechSynthesis.speak(u);
  }catch(e){console.warn('TTS not supported', e);}
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(arr){const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;}

/* ============================================================
   SIDEBAR RENDER
   ============================================================ */
function renderSidebar(){
  const ul = document.getElementById('lesson-list');
  ul.innerHTML='';
  for(let i=1;i<=15;i++){
    const L = LESSONS[i];
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className='lesson-btn'+(i===state.lessonId?' active':'')+(!L.filled?' disabled':'');
    btn.innerHTML = `<span class="num">${i}</span><span class="lbl">
        <span class="zh hanzi">${L.filled? esc(L.zh) : ('Bài '+i)}</span>
        <span class="vi">${L.filled? esc(L.vi) : 'Đang biên soạn'}</span>
      </span>${!L.filled?'<span class="soon-tag">Sắp có</span>':''}`;
    if(L.filled){
      btn.onclick=()=>{state.lessonId=i; state.specialView=null; renderAll(); if(window.innerWidth<=840) document.getElementById('sidebar').classList.remove('open');};
    }
    li.appendChild(btn);
    ul.appendChild(li);
  }
}

function renderTabbar(){

  TABS.forEach(t=>{

    b.className='tab-btn'+(t.id===state.tab?' active':'');
    b.innerHTML = `<span>${t.icon}</span><span>${t.label}</span>`;

    overview: renderOverview, vocab: renderVocab, flash: renderFlash,

}

function buildMCQ1(vocab){
  const wrap = document.getElementById('mcq1');
  const picks = shuffle(vocab).slice(0,6);
  wrap.innerHTML = picks.map((v,qi)=>{
    const distractors = shuffle(vocab.filter(x=>x.hz!==v.hz)).slice(0,3).map(x=>x.vi);
    const opts = shuffle([v.vi, ...distractors]);
    return `<div class="q">
      <div class="qtext">Câu ${qi+1}: <span class="zh hanzi">${esc(v.hz)}</span> <span class="mono" style="color:var(--accent-dark);">(${esc(v.py)})</span> nghĩa là gì?</div>
      <div class="opt-row">${opts.map(o=>`<div class="opt" onclick="checkOpt(this,'${esc(o).replace(/'/g,"\\'")}','${esc(v.vi).replace(/'/g,"\\'")}')">${esc(o)}</div>`).join('')}</div>
    </div>`;
  }).join('');
}
function checkOpt(node, chosen, correct){
  const row = node.parentElement;
  if(row.dataset.answered) return; // chỉ tính điểm 1 lần / câu
  row.dataset.answered='1';
  row.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
  if(chosen===correct){ node.classList.add('correct'); recordAttempt(true); }
  else{ node.classList.add('wrong'); recordAttempt(false);
    row.querySelectorAll('.opt').forEach(o=>{ if(o.textContent.trim()===correct) o.classList.add('correct'); });
  }
}
function buildFill2(vocab){
  const wrap = document.getElementById('fill2');
  const picks = shuffle(vocab).slice(0,6);
  wrap.innerHTML = picks.map((v,qi)=>`
    <div class="q">
      <div class="qtext">Câu ${qi+1}: <span class="zh hanzi" style="font-size:22px;">${esc(v.hz)}</span> — pinyin là?</div>
      <input type="text" id="fill2-${qi}" placeholder="Gõ pinyin có dấu, vd: hǎochī">
      <button class="btn sm" style="margin-left:8px;" onclick="checkFill2(${qi},'${v.py}')">Kiểm tra</button>
      <div class="fb" id="fill2-fb-${qi}"></div>
    </div>`).join('');
}
function checkFill2(qi, answer){
  const val = document.getElementById('fill2-'+qi).value.trim().toLowerCase();
  const fb = document.getElementById('fill2-fb-'+qi);
  const ok = val === answer.toLowerCase();
  if(ok){ fb.textContent='✓ Chính xác!'; fb.className='fb ok'; }
  else{ fb.textContent='✗ Chưa đúng. Đáp án: '+answer; fb.className='fb no'; }
  recordAttempt(ok);
}
function buildMatch3(vocab){
  window._match3Checked = false;
  const wrap = document.getElementById('match3');
  const picks = shuffle(vocab).slice(0,6);
  const meanings = shuffle(picks.map(v=>v.vi));
  window._match3 = picks;
  wrap.innerHTML = `<table class="vocab"><tbody>${picks.map((v,i)=>`
    <tr><td class="hz-cell hanzi">${esc(v.hz)}</td><td class="mono py-cell">${esc(v.py)}</td>
    <td><select class="match-select" id="match3-${i}">
      <option value="">— chọn nghĩa —</option>
      ${meanings.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}
    </select></td></tr>`).join('')}</tbody></table>`;
}
function checkMatch3(){
  if(window._match3Checked) return;
  window._match3Checked = true;
  let correct=0;
  window._match3.forEach((v,i)=>{
    const sel = document.getElementById('match3-'+i);
    const ok = sel.value===v.vi;
    if(ok){ sel.style.borderColor='var(--success)'; sel.style.background='var(--success-bg)'; correct++; }
    else{ sel.style.borderColor='var(--error)'; sel.style.background='var(--error-bg)'; }
    recordAttempt(ok);
  });
  document.getElementById('match3-result').innerHTML = `<b>Kết quả: ${correct}/${window._match3.length} đúng</b>`;
}

function buildGMCQ(){
  const qs = [
    {q:'我 ___ 说汉语。 (Tôi biết nói tiếng Trung.)', opts:['会','很','怎么'], a:'会'},
    {q:'中国菜 ___ 好吃。 (Món Trung Quốc rất ngon.)', opts:['会','很','怎么'], a:'很'},
    {q:'这个字 ___ 写？ (Chữ này viết thế nào?)', opts:['会','很','怎么'], a:'怎么'},
    {q:'我 ___ 做中国菜。 (Tôi không biết nấu món Trung Quốc — phủ định của 会)', opts:['不会','很不','不很'], a:'不会'},
  ];
  document.getElementById('gmcq').innerHTML = qs.map((it,qi)=>`
    <div class="q"><div class="qtext zh hanzi" style="font-size:16px;">Câu ${qi+1}: ${esc(it.q)}</div>
    <div class="opt-row">${shuffle(it.opts).map(o=>`<div class="opt hanzi" onclick="checkOpt(this,'${o}','${it.a}')">${o}</div>`).join('')}</div></div>
  `).join('');
}
function buildGFill(){
  const qs = [
    {q:'你妈妈 ___ 说汉语吗？', a:'会'},
    {q:'我妈妈的汉语不 ___ 。 (không tốt)', a:'好'},
    {q:'你的汉语名字 ___ 写？', a:'怎么'},
  ];
  document.getElementById('gfill').innerHTML = qs.map((it,qi)=>`
    <div class="q"><div class="qtext zh hanzi" style="font-size:16px;">${esc(it.q)}</div>
    <input type="text" id="gfill-${qi}" placeholder="Gõ chữ Hán còn thiếu">
    <button class="btn sm" style="margin-left:8px;" onclick="checkFill2 ? checkGFill(${qi},'${it.a}') : null">Kiểm tra</button>
    <div class="fb" id="gfill-fb-${qi}"></div></div>
  `).join('');
}

async function fetchStudentProgress(){
  if(!student) return null;
  if(!CONFIG.SHEET_WEBAPP_URL || CONFIG.SHEET_WEBAPP_URL.indexOf('DÁN_ID_WEB_APP')>-1) return {error:'config'};
  try{
    const url = CONFIG.SHEET_WEBAPP_URL + '?action=studentProgress&name=' + encodeURIComponent(student.name) + '&class=' + encodeURIComponent(student.class);
    const res = await fetch(url, {method:'GET'});
    return await res.json();
  }catch(err){
    console.warn('Không tải được dữ liệu tiến bộ:', err);
    return {error:'network'};
  }
}

function renderSpecialView(){
  const el = document.getElementById('content');
  el.innerHTML = `<div class="placeholder"><span class="big">⏳</span>Đang tải dữ liệu từ hệ thống...</div>`;
  fetchStudentProgress().then(data=>{
    if(!data || data.error==='config'){ el.innerHTML = `<div class="placeholder"><span class="big">⚠️</span>Hệ thống chưa được cấu hình kết nối. Vui lòng liên hệ giáo viên.</div>`; return; }
    if(data.error==='network'){ el.innerHTML = `<div class="placeholder"><span class="big">⚠️</span>Không kết nối được hệ thống. Vui lòng thử lại hoặc liên hệ giáo viên.</div>`; return; }
    if(state.specialView==='assignments') renderAssignmentsView(el, data);
    else renderProgressView(el, data);
  });
}

function renderAssignmentsView(el, data){
  const assignments = data.assignments || [];
  const submissions = data.submissions || [];
  el.innerHTML = `
    <div class="section-title">📋 Bài tập được giao</div>
    <p class="section-sub">Các bài tập tự luận giáo viên giao cho lớp ${esc(student.class)}</p>
    <div id="assign-list"></div>
  `;
  const list = document.getElementById('assign-list');
  if(assignments.length===0){ list.innerHTML = '<div class="placeholder">Hiện chưa có bài tập nào được giao.</div>'; return; }
  list.innerHTML = assignments.map(a=>{
    const sub = submissions.find(s=>s['Mã bài tập']===a['Mã bài tập']);
    const due = a['Hạn nộp'] ? new Date(a['Hạn nộp']).toLocaleDateString('vi-VN') : '';
    let body;
    if(sub && sub['Trạng thái']==='Đã chấm'){
      body = `<div class="fb ok">✓ Đã chấm — Điểm: ${esc(sub['Điểm'])}</div><p style="font-size:12.5px;color:var(--ink-soft);">Nhận xét: ${esc(sub['Nhận xét']||'')}</p>`;
    }else if(sub && sub['Trạng thái']==='Đã nộp'){
      body = `<div class="fb" style="color:var(--warn,#a4732c);">⏳ Đã nộp — đang chờ giáo viên chấm</div>`;
    }else{
      body = `<textarea id="assign-input-${esc(a['Mã bài tập'])}" placeholder="Nhập nội dung bài làm..."></textarea>
        <button class="btn sm" onclick="doSubmitAssignment('${esc(a['Mã bài tập'])}')">Nộp bài</button>`;
    }
    return `<div class="assign-card">
      <h4>${esc(a['Tiêu đề'])}</h4>
      <div class="due">Hạn nộp: ${due} · ${esc(a['Mô tả']||'')}</div>
      ${body}
    </div>`;
  }).join('');
}

function doSubmitAssignment(assignmentId){
  const val = document.getElementById('assign-input-'+assignmentId).value.trim();
  if(!val){ alert('Vui lòng nhập nội dung bài làm trước khi nộp.'); return; }
  fetch(CONFIG.SHEET_WEBAPP_URL, {
    method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'submitAssignment', assignmentId, name:student.name, class:student.class, content:val})
  }).then(()=>{ alert('Đã nộp bài thành công!'); renderSpecialView(); })
    .catch(()=>{ alert('Có lỗi khi nộp bài, vui lòng thử lại.'); });
}

const TREE_STAGES2 = [
  {emoji:'🌱', label:'Mầm cây', minCount:0, minAvg:0},
  {emoji:'🪴', label:'Cây non', minCount:3, minAvg:0},
  {emoji:'🌿', label:'Cây đang phát triển', minCount:7, minAvg:65},
  {emoji:'🌳', label:'Cây trưởng thành', minCount:12, minAvg:75},
  {emoji:'✨', label:'Cây xuất sắc', minCount:15, minAvg:88},
];
function renderProgressView(el, data){
  const results = (data.results||[]).filter(r=>r['Họ tên'] && String(r['Họ tên']).trim().toLowerCase()===student.name.trim().toLowerCase());
  const count = results.length;
  const avg = count>0 ? Math.round(results.reduce((s,r)=>s+Number(r['Tỷ lệ %']||0),0)/count) : 0;
  let idx=0;
  TREE_STAGES2.forEach((s,i)=>{ if(count>=s.minCount && avg>=s.minAvg) idx=i; });
  const stage = TREE_STAGES2[idx];
  const next = TREE_STAGES2[idx+1];
  const percent = next ? Math.min(100, Math.round(count/next.minCount*100)) : 100;
  const needMore = next ? Math.max(0, next.minCount-count) : 0;

  el.innerHTML = `
    <div class="section-title">🌳 Tiến bộ của tôi</div>
    <p class="section-sub">Dựa trên toàn bộ lượt ôn tập bạn đã nộp trong hệ thống</p>
    <div class="goal-grid" style="margin-bottom:22px;">
      <div class="goal-card"><span class="ic">✅</span><h4>${count}</h4><p>Lượt ôn tập đã nộp</p></div>
      <div class="goal-card"><span class="ic">⭐</span><h4>${avg}%</h4><p>Tỷ lệ đúng trung bình</p></div>
    </div>
    <div class="card" style="margin-bottom:22px;">
      <div class="tree-wrap2">
        <div class="tree-visual2">${stage.emoji}</div>
        <div>
          <div style="font-family:'Noto Serif SC';font-size:19px;font-weight:700;">${stage.label}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 8px;">${next ? 'Cần thêm '+needMore+' lượt ôn tập để lên cấp "'+next.label+'"' : 'Đã đạt cấp độ cao nhất!'}</div>
          <div class="tree-progress-track2"><div class="tree-progress-fill2" style="width:${percent}%;"></div></div>
        </div>
      </div>
    </div>
    <div class="section-title" style="font-size:15px;">📈 Biểu đồ tỷ lệ đúng theo thời gian</div>
    <div class="card" style="margin-bottom:22px;"><div style="position:relative;height:240px;"><canvas id="progress-chart"></canvas></div></div>
    <div id="milestones2"></div>
  `;

  if(count>0){
    const sorted = results.slice().sort((a,b)=>new Date(a['Thời gian'])-new Date(b['Thời gian']));
    new Chart(document.getElementById('progress-chart'), {
      type:'line',
      data:{ labels: sorted.map((r,i)=>'Lần '+(i+1)), datasets:[{ label:'Tỷ lệ đúng (%)', data: sorted.map(r=>Number(r['Tỷ lệ %']||0)), borderColor:'#c23320', backgroundColor:'rgba(194,51,32,.1)', fill:true, tension:.3, pointRadius:4 }] },
      options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ min:0, max:100 } }, plugins:{ legend:{display:false} } }
    });
    const msgs = [];
    msgs.push('🎯 Bạn đã hoàn thành ' + count + ' lượt ôn tập.');
    if(sorted.length>=2){
      const first = Number(sorted[0]['Tỷ lệ %']), last = Number(sorted[sorted.length-1]['Tỷ lệ %']);
      if(last>first) msgs.push('📈 Tỷ lệ đúng đã tăng từ ' + first + '% lên ' + last + '%.');
      else if(last<first) msgs.push('📉 Tỷ lệ đúng gần nhất giảm còn ' + last + '% — nên ôn tập thêm.');
    }
    if(next) msgs.push('🌟 Chỉ cần thêm ' + needMore + ' lượt ôn tập để cây bước sang giai đoạn "' + next.label + '"!');
    else msgs.push('🏆 Bạn đã đạt cấp độ cao nhất của cây tiến bộ!');
    document.getElementById('milestones2').innerHTML = msgs.map(m=>`<div class="milestone2">${m}</div>`).join('');
  }else{
    document.getElementById('milestones2').innerHTML = '<div class="milestone2">Bạn chưa nộp lượt ôn tập nào. Hãy vào các bài học và làm bài ở tab "Ôn từ vựng", "Ôn ngữ pháp"... rồi bấm "Nộp kết quả" để bắt đầu!</div>';
  }
}
</script>
</body>
</html>
